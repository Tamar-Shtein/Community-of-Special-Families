name: Check source links

# Rights information is only as good as its sources. Once a week, check that
# every link on the page still opens. Weekly is enough: pages on Kol Zchut and
# Bituach Leumi move rarely, and nobody is waiting on this minute by minute.
on:
  schedule:
    - cron: "23 6 * * 0"     # Sunday, 06:23 UTC (morning in Israel)
  workflow_dispatch:

permissions:
  contents: write   # save data/links-status.json
  issues: write     # open an issue when a link is broken

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every link on the page
        run: |
          mkdir -p data
          python scripts/check_links.py

      - name: Save the result (shown on the page)
        run: |
          git config user.name "link-check"
          git config user.email "actions@users.noreply.github.com"
          git add data/links-status.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Weekly link check"
          git pull --rebase
          git push

      - name: Open an issue if a link is broken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BROKEN=$(python -c "import json; d=json.load(open('data/links-status.json')); print(d['broken'])")
          if [ "$BROKEN" = "0" ]; then echo "No broken links."; exit 0; fi
          python - > body.md <<'EOF'
          import json
          d = json.load(open("data/links-status.json"))
          print(f"בבדיקה האוטומטית מ-{d['checked_at'][:10]} נמצאו קישורים שבורים בעמוד:\n")
          for l in d["links"]:
              if l["state"] == "broken":
                  print(f"- **{l['text']}** ({l['detail']}): {l['url']}")
          print("\nכדאי למצוא את הדף החדש באתר המקור ולעדכן את הקישור ב-index.html.")
          EOF
          gh label create broken-links --color D93F0B --description "Found by the weekly link check" --force
          OPEN=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file body.md
          else
            gh issue create --title "קישורים שבורים במדריך הזכויות" --label broken-links --body-file body.md
          fi
